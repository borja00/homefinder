# Local Postgres for development: docker compose up -d
# DATABASE_URL=postgres://homefinder:homefinder@localhost:5434/homefinder
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homefinder
      POSTGRES_PASSWORD: homefinder
      POSTGRES_DB: homefinder
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
